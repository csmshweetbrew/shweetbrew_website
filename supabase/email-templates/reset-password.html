<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Subject: Reset your Shweet Brew password | איפוס סיסמה
     The link brings them back to the site, which asks for the new password. -->
<div style="margin:0;padding:24px 12px;background:#f5efe6;font-family:Arial,Helvetica,sans-serif;color:#1a1816">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e8dfd2">
    <div style="background:#cd2027;padding:18px 24px;text-align:center">
      <span style="font-size:24px;letter-spacing:3px;font-weight:900;color:#f5e9d9">SHWEET BREW</span>
    </div>
    <div style="padding:28px 24px;text-align:center">
      <p style="margin:0 0 6px;font-size:18px;font-weight:700">Reset your password</p>
      <p style="margin:0 0 22px;font-size:15px;color:#5a534c">Tap the button to choose a new one.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;border-radius:4px;background:#cd2027;color:#f5e9d9;font-weight:900;text-decoration:none">Choose a new password / בחירת סיסמה חדשה</a>
      <p style="margin:22px 0 24px;font-size:13px;color:#867f77">If you didn't ask for this, ignore this email; your password stays the same.</p>
      <hr style="border:none;border-top:1px solid #eee5d8;margin:0 0 24px">
      <div dir="rtl" style="text-align:center">
        <p style="margin:0 0 6px;font-size:18px;font-weight:700">איפוס סיסמה</p>
        <p style="margin:0 0 12px;font-size:15px;color:#5a534c">לחצו על הכפתור כדי לבחור סיסמה חדשה. אם לא ביקשתם את זה, אפשר להתעלם מהמייל והסיסמה לא תשתנה.</p>
      </div>
    </div>
  </div>
</div>
