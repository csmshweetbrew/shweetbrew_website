[build]
  base = ""
  command = "cd client && pnpm install && pnpm run build"
  publish = "dist/public"

[context.production]
  command = "cd client && pnpm install && pnpm run build"

[context.deploy-preview]
  command = "cd client && pnpm install && pnpm run build"

# Returning visitors keep what they already have (fewer Netlify credits).
# /assets: the file name changes with every build, so it can stay for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pictures keep their name when they change, so check again after a week (give a replaced picture a new name to show it at once).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
