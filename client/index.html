<!doctype html>
<html lang="en" class="dark">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Shweet Brew — Biltong, Boerewors &amp; Braai Culture in Israel</title>
    <meta name="description" content="Authentic South African biltong, boerewors, drywors, chilli bites, beef jerky, and Shweet Brew Shots — made with Israeli pride. Order on WhatsApp for delivery in Israel." />
    <!--
      Self-hosted fonts (files in client/public/fonts, from Fontsource).
      font-display: block + preload means text waits a moment for the real font
      instead of flashing in a fallback font and then switching.
    -->
    <link rel="preload" href="/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Hero photo (self-hosted WebP): start downloading the right size immediately -->
    <link rel="preload" as="image" href="/images/hero-1280.webp" imagesrcset="/images/hero-960.webp 960w, /images/hero-1280.webp 1280w" imagesizes="100vw" fetchpriority="high" />
    <script>
      // Reveal-on-scroll: hide [data-reveal] content from the first paint (lib/reveal.ts shows it).
      // Skipped for visitors who prefer reduced motion.
      try {
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reveal-on");
      } catch (e) {}
    </script>
    <script>
      // Hebrew visitors: preload the Hebrew faces too (language is remembered in localStorage)
      try {
        var lang = localStorage.getItem("shweet-brew-language");
        if (lang === "he") {
          // Set Hebrew before the first paint so the page never flashes in English first
          document.documentElement.lang = "he";
          document.documentElement.dir = "rtl";
          ["open-sans-hebrew-700-normal", "open-sans-hebrew-800-normal", "open-sans-latin-700-normal"].forEach(function (f) {
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
            l.href = "/fonts/" + f + ".woff2";
            document.head.appendChild(l);
          });
        }
      } catch (e) {}
    </script>
    <style>
      @font-face { font-family: "Bebas Neue"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/bebas-neue-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Lato"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/lato-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Lato"; font-style: italic; font-weight: 400; font-display: block; src: url(/fonts/lato-latin-400-italic.woff2) format("woff2"); }
      @font-face { font-family: "Lato"; font-style: normal; font-weight: 700; font-display: block; src: url(/fonts/lato-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Lato"; font-style: normal; font-weight: 900; font-display: block; src: url(/fonts/lato-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 400; font-display: block; src: url(/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/open-sans-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 700; font-display: block; src: url(/fonts/open-sans-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 800 900; font-display: block; src: url(/fonts/open-sans-hebrew-800-normal.woff2) format("woff2"); unicode-range: U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/open-sans-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 700; font-display: block; src: url(/fonts/open-sans-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 800 900; font-display: block; src: url(/fonts/open-sans-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
